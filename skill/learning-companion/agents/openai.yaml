display_name: Learning Companion
short_description: 中文通用学习陪练，帮你学懂新语言/论文/开源项目/技术方向，有状态工作区+一手引用+双链笔记+自测闪卡，支持快速拆解轻模式。
default_prompt: 请先判断我的请求属于快速拆解、有状态学习开局、继续学习还是生成自测；快速拆解只给全局地图+一页纸+一手来源，不建工作区；有状态学习在当前目录建学习工作区、先定 Mission 再按最近发展区教；只说“继续”时按 progress.md、learning-records、MISSION.md 顺序重建上下文。涉及具体 API/论文结论/项目实现时不凭记忆讲，先引用一手来源。输出中文结果，技术术语保留英文。
